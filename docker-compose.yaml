services:
  node:
    image: "node"
    user: "node"
    working_dir: /home/node/app
    environment:
      - NODE_ENV=development
      # Overrides the env file's DB_HOST=localhost: from inside this
      # container the database is `master-sql`, the mysql container shared
      # across projects on this host, reachable over the shared-net network
      # joined below — not localhost, and not a db service of our own.
      - DB_HOST=master-sql
      - DB_PORT=3306
    volumes:
      - ./:/home/node/app
    ports:
      - "3005:3000"
    networks:
      - shared-net
    # The dev server has no supervisor of its own — without this, a crash
    # (OOM-kill, an uncaught exception, losing the shared-net link to
    # master-sql) leaves the container exited until someone notices and runs
    # `docker compose up -d` by hand.
    restart: unless-stopped
    # `node_modules` comes from the bind mount above, so install on the host
    # (`npm ci`) and let the container only run the dev server. Installing in
    # here instead meant every restart rewrote package-lock.json in the
    # working tree — churn that then blocked the next `git pull` — and it
    # failed outright whenever a root-owned file had landed in the tree, since
    # this container is uid 1000 (`node`). Run git and npm on the host as the
    # user owning the checkout, not as root, for the same reason.
    command: npm run dev

networks:
  shared-net:
    external: true
